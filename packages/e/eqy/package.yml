# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : eqy
version    : '0.70'
release    : 5
source     :
    - https://github.com/YosysHQ/eqy/archive/refs/tags/v0.70.tar.gz : 8eb3e295c7d1e5708a5879188648371a1a8244be2403221622a953a70f22d412
homepage   : https://yosyshq.readthedocs.io/projects/eqy/en/latest/
license    : ISC
component  : office.scientific
summary    : Equivalence checking with Yosys
description: |
    Equivalence Checking with Yosys (EQY) is a front-end driver program for Yosys-based formal hardware verification flows.
clang      : true
builddeps  :
    - pkgconfig(python3)
    - pkgconfig(tcl)
    - libboost-devel
    - sby
    - yosys-devel
rundeps    :
    - yosys
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
